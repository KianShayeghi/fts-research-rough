# The bibliography. Every work cited anywhere in this repository is described here and only
# here; `docs/references.md` and `docs/references.bib` are written from this file by
# `scripts/bibliography.py`, and prose cites by a number that script assigns and maintains.
#
# To add a work: give it a lowercase hyphenated key, fill in what is known, and run
# `python scripts/bibliography.py --write`. The numbering is alphabetical by first author, so
# the new entry will renumber the ones after it in every file that cites them, which is the
# point of doing it here rather than by hand.
#
# Fields. `kind` is one of article, chapter, book, software, working-paper, preprint, blog and
# picks the BibTeX entry type. `letter` disambiguates two works by the same authors in the same
# year. `note` is what this repository has to say about the work, and is the only place such a
# remark belongs. `cited_as` lists names prose uses for a work whose authorship is not recorded
# here. A missing `title` is allowed only with a `note` explaining the gap, so that a citation
# this repository never chased down is visible rather than quietly plausible.
#
# The entries below are in key order, which is for reading. The order they are numbered in is
# computed, and does not depend on this file's arrangement.

