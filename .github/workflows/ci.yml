name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra notebooks --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run flake8 src scripts tests
          uv run nbqa flake8 notebooks

      - name: Test
        # The cached CSVs under data/ are committed, so no dataset is downloaded here.
        run: uv run pytest -q --durations=10
